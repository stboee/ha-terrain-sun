name: Publish Terrain Sun

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - custom_components/terrain_sun/manifest.json
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish the manifest version
        shell: bash
        run: |
          set -euo pipefail
          repository="repos/$GITHUB_REPOSITORY"
          manifest=$(gh api "$repository/contents/custom_components/terrain_sun/manifest.json?ref=$GITHUB_SHA" --jq .content | base64 --decode)
          version=$(jq -er .version <<< "$manifest")
          if [[ ! "$version" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]+)?$ ]]; then
            printf 'Invalid Terrain Sun version: %s\n' "$version" >&2
            exit 1
          fi
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            actual=$(gh api "$repository/commits/$tag" --jq .sha)
            test "$actual" = "$GITHUB_SHA"
            exit 0
          fi

          notes_path="docs/releases/$tag.md"
          notes_file=$(mktemp)
          trap 'rm -f "$notes_file"' EXIT
          if ! gh api "$repository/contents/$notes_path?ref=$GITHUB_SHA" --jq .content | base64 --decode > "$notes_file" || ! test -s "$notes_file"; then
            printf 'Add release notes in %s before publishing.\n' "$notes_path" >&2
            exit 1
          fi

          if actual=$(gh api "$repository/commits/$tag" --jq .sha 2>/dev/null); then
            test "$actual" = "$GITHUB_SHA"
          else
            tag_sha=$(jq -n --arg tag "$tag" --arg sha "$GITHUB_SHA" --rawfile message "$notes_file" \
              '{tag: $tag, object: $sha, type: "commit", message: $message,
                tagger: {name: "github-actions[bot]", email: "41898282+github-actions[bot]@users.noreply.github.com"}}' \
              | gh api --method POST "$repository/git/tags" --input - --jq .sha)
            gh api --method POST "$repository/git/refs" -f ref="refs/tags/$tag" -f sha="$tag_sha" >/dev/null
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Terrain Sun $version" --notes-file "$notes_file"
